# =============================================================================
# SERVICE REPO — THIN CALLER of the CENTRAL PIPELINE (mbeema/platform-pipelines@v1)
# Repo: mbeema/service-orders
#
# This repo contains almost no logic: every job delegates to a reusable
# workflow in the central pipeline. build/deploy use the POC (dummy) variants;
# release + bump-ledger are the same reusable workflows used in production.
# Prod is NOT here — it is released from platform-releases via prod.json.
# =============================================================================
name: ci-cd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write     # release job (in the central workflow) pushes a tag + Release
  id-token: write

jobs:
  build:
    uses: mbeema/platform-pipelines/.github/workflows/reusable-build-poc.yml@v1
    with:
      service_name: orders

  deploy-dev:
    needs: build
    uses: mbeema/platform-pipelines/.github/workflows/reusable-deploy-poc.yml@v1
    with:
      environment: dev
      app_name: orders-dev
      version: ${{ needs.build.outputs.version }}

  deploy-staging:
    needs: [build, deploy-dev]
    uses: mbeema/platform-pipelines/.github/workflows/reusable-deploy-poc.yml@v1
    with:
      environment: staging
      app_name: orders-staging
      version: ${{ needs.build.outputs.version }}

  release:
    needs: build
    uses: mbeema/platform-pipelines/.github/workflows/reusable-release.yml@v1
    with:
      service_name: orders
      # image_name omitted -> the Azure re-tag steps self-skip (POC)
    secrets: inherit

  bump-staging-ledger:
    needs: [build, deploy-staging, release]
    uses: mbeema/platform-pipelines/.github/workflows/reusable-bump-ledger-poc.yml@v1
    with:
      service_name: orders
      version: ${{ needs.build.outputs.version }}
      semver: ${{ needs.release.outputs.semver }}
      environment: staging
    secrets: inherit    # passes LEDGER_DEPLOY_KEY
